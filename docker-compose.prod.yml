name: marketing-ai

services:
  app:
    container_name: marketing-ai-php
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: [CMD, php-fpm, -t]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [marketing-ai-network]

  queue:
    container_name: marketing-ai-queue
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=120 --max-time=3600
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on: [app]
    restart: unless-stopped
    networks: [marketing-ai-network]

  scheduler:
    container_name: marketing-ai-scheduler
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on: [app]
    restart: unless-stopped
    networks: [marketing-ai-network]

  nginx:
    container_name: marketing-ai-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
      - nginx-logs:/var/log/nginx
    depends_on: [app]
    restart: unless-stopped
    networks: [marketing-ai-network]

  db:
    container_name: marketing-ai-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [marketing-ai-network]

  redis:
    container_name: marketing-ai-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks: [marketing-ai-network]

  loki:
    container_name: marketing-ai-loki
    image: grafana/loki:latest
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [marketing-ai-network]

  promtail:
    container_name: marketing-ai-promtail
    image: grafana/promtail:latest
    profiles: [observability]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./src/storage/logs:/var/www/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped
    networks: [marketing-ai-network]

  grafana:
    container_name: marketing-ai-grafana
    image: grafana/grafana:latest
    profiles: [observability]
    # Bound to loopback: reach it through an SSH tunnel, not the public internet.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [loki]
    restart: unless-stopped
    networks: [marketing-ai-network]

networks:
  marketing-ai-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nginx-logs:
  certbot-webroot:
  loki-data:
  grafana-data:
