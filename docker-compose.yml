name: marketing-ai

services:
  app:
    container_name: marketing-ai-php-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [marketing-ai-network]

  queue:
    container_name: marketing-ai-queue-dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=120
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    depends_on:
      app:
        condition: service_started
    networks: [marketing-ai-network]

  nginx:
    container_name: marketing-ai-nginx-dev
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on: [app]
    networks: [marketing-ai-network]

  node:
    container_name: marketing-ai-node-dev
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    # No published port: nginx proxies the dev server, so Vite is reached through
    # http://localhost like everything else. Publishing it again would give two origins.
    volumes:
      - ./src:/var/www/html
    networks: [marketing-ai-network]

  db:
    container_name: marketing-ai-mysql-dev
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-marketing_ai}
      MYSQL_USER: ${MYSQL_USER:-marketing_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [marketing-ai-network]

  redis:
    container_name: marketing-ai-redis-dev
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks: [marketing-ai-network]

  loki:
    container_name: marketing-ai-loki-dev
    image: grafana/loki:latest
    profiles: [observability]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [marketing-ai-network]

  promtail:
    container_name: marketing-ai-promtail-dev
    image: grafana/promtail:latest
    profiles: [observability]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./src/storage/logs:/var/www/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [marketing-ai-network]

  grafana:
    container_name: marketing-ai-grafana-dev
    image: grafana/grafana:latest
    profiles: [observability]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [loki]
    networks: [marketing-ai-network]

networks:
  marketing-ai-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nginx-logs:
  loki-data:
  grafana-data:
