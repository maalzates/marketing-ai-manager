server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Matches post_max_size in php.ini and the 300 MB cap in StoreAssetRequest. A smaller
    # value here answers 413 before PHP ever sees the upload.
    client_max_body_size 320M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Vite's dev server, proxied so the whole application lives on one origin. Without this
    # the browser has to reach :5173 directly, which means two origins, a published port,
    # and asset URLs that differ between development and production.
    #
    # Only Vite's own prefixes are proxied. Everything else must keep falling through to
    # Laravel, because the SPA uses history routing and owns every other path.
    location ~ ^/(@vite|@id|@fs|@vue|@react-refresh|resources|node_modules)/ {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The HMR websocket. Vite is told to advertise this exact path (see vite.config.js), so
    # the client connects to ws://localhost/vite-hmr instead of ws://localhost:5173.
    location /vite-hmr {
        proxy_pass http://node:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # A 300 MB upload has to reach Drive within this window, and the request does not
    # return until it has.
        fastcgi_read_timeout 600;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
