memory_limit = 512M
; A reel is the biggest thing this application receives, and StoreAssetRequest allows
; 300 MB per piece. Below that, nginx or PHP drops the body and the validator reports the
; file as missing — which reads as a bug in the form rather than a size limit.
upload_max_filesize = 300M
post_max_size = 320M
max_execution_time = 600

; On with timestamp validation, not off: a bind mount on macOS makes recompiling every
; file on every request the single slowest thing in a local request. revalidate_freq = 0
; still stats each file, so an edit is picked up on the next request.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

display_errors = On
error_reporting = E_ALL
