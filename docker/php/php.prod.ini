memory_limit = 512M
; A reel is the biggest thing this application receives, and StoreAssetRequest allows
; 300 MB per piece. Below that, nginx or PHP drops the body and the validator reports the
; file as missing — which reads as a bug in the form rather than a size limit.
upload_max_filesize = 300M
post_max_size = 320M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off

; The image ships pcov because the same Dockerfile builds dev and prod.
; Production never measures coverage, so it stays off.
pcov.enabled = 0
