name: CI

on:
  pull_request:
  # Called by deploy.yml on the merge commit: the tree that merged is not always the tree
  # the PR tested, and it is the merged one that ships.
  workflow_call:

jobs:
  backend:
    name: PHP tests & style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    # The suite runs against MySQL, not sqlite, so the repository tests exercise the
    # queries that actually ship.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marketing_ai_testing
          MYSQL_USER: marketing_ai
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          # The compose service name `db` does not resolve on the runner.
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
